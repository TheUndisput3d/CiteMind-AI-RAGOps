apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: citemind-ingress
  namespace: citemind-ragops
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: citemind.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: citemind-frontend
                port:
                  number: 80
