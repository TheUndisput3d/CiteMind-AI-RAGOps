name: citemind-ai-ragops

services:
  ollama:
    image: ollama/ollama:latest
    container_name: citemind-ai-ragops-ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: citemind-ai-ragops-ollama-pull
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama pull "$${OLLAMA_CHAT_MODEL}"
        ollama pull "$${OLLAMA_EMBEDDING_MODEL}"
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: citemind-ai-ragops-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      target: runtime
    image: citemind-ai-backend:latest
    container_name: citemind-ai-ragops-backend
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-300}
      OLLAMA_NUM_GPU: ${OLLAMA_NUM_GPU:-999}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-citemind}
      USER_AGENT: ${USER_AGENT:-CiteMindAI/0.2}
    expose:
      - "8000"
    volumes:
      - ./sessions.json:/app/sessions.json
      - ./checkpoints.db:/app/checkpoints.db
      - ./embedding_cache:/app/embedding_cache
    depends_on:
      qdrant:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend-runtime
    image: citemind-ai-frontend:latest
    container_name: citemind-ai-ragops-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CITEMIND_PORT:-8020}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: citemind-ai-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: citemind-ai-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
